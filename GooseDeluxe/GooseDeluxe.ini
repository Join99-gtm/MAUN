; Настройки GooseDeluxe. True/False, после правки перезапусти гуся.
AntiAlias=True
SoftShadow=True
Legs=True
Waddle=True
SmoothTurning=True
SquashStretch=True
LookAtCursor=True
Blink=True
IdleAnimations=True
Wings=True
HonkAnimation=True
Particles=True
HonkText=True
; Шляпа: None, TopHat, Party, Santa
Hat=None
; Размер гуся, 0.5 - 3.0
Scale=1
; Гусь ходит с той скоростью, что задумал автор (в оригинале он медленнее)
FixSpeed=True
; Честно случайный порядок проделок (в оригинале он почти всегда один и тот же)
HonestRandom=True
; Прятаться, пока открыта игра, видео или презентация на весь экран
PauseInFullscreen=True
; Значок гуся в трее с меню
Tray=True
; Ctrl+Alt+G — позвать гуся, Ctrl+Alt+H — гудок, Ctrl+Alt+P — пауза
Hotkeys=True
; RU — «ГА-ГА-ГА!», EN — «HONK!»
Language=RU
; Русские записки в блокноте гуся (английские убираются в *.txt.en)
RussianNotes=True
; Гусь к другу: записки, картинки и визиты через сервер ntfy
Friends=True
; Разрешить другу присылать гуся за твоим курсором
FriendCanStealMouse=True
; Сервер для гусиной почты (можно свой ntfy)
NtfyServer=https://ntfy.sh
; Времена года: Auto — по дате, Off — выключить, или Winter/Spring/Summer/Autumn (можно по-русски: Зима…). Листья — только осенью, снег — зимой
Seasons=Auto
; Шарф на гусе зимой
WinterScarf=True
; Новогодняя шапка с 20 декабря по 10 января (если своя шляпа не выбрана)
NewYearHat=True
; Кучи листьев разлетаются от клика мышкой
ClickLeafPiles=True
; Мемы и записки гуся по кругу, без повторов
NoRepeats=True
